<!DOCTYPE html>
<html lang="en" data-accent="slate">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
	<title>Restaurant Mobile</title>
	<base href="/" />
	<!-- Handbook §12: the two UPOS stylesheets, tokens first — upos-components.css
	     reads tokens upos-tokens.css defines, so reversing them leaves every
	     component unstyled. They are served straight out of Restaurant.UI.Shared,
	     which is the one copy both hosts read.

	     Restaurant.Mobile.styles.css is the scoped-CSS bundle. Without it none of
	     the .razor.css files in the shared library reach this host at all, which is
	     why the terminal shell, the cart line and the menu card all render flat
	     here today.

	     Bootstrap is gone (§12's migration, step 1): its chrome has to be overridden
	     before one UPOS screen looks right, no screen here depends on its grid, and
	     every byte ships to a device that has to work with no network. -->
	<link rel="stylesheet" href="_content/Restaurant.UI.Shared/css/upos-tokens.css" />
	<link rel="stylesheet" href="_content/Restaurant.UI.Shared/css/upos-components.css" />
	<link rel="stylesheet" href="css/app.css" />
	<link rel="stylesheet" href="Restaurant.Mobile.styles.css" />
</head>

<body>
	<div id="app">Loading...</div>

	<div id="blazor-error-ui">
		An unhandled error has occurred.
		<a href="" class="reload">Reload</a>
		<a class="dismiss">Dismiss</a>
	</div>

	<script src="_framework/blazor.webview.js" autostart="false"></script>

	<!-- Theming contract (handbook §11, §12): data-theme and data-accent live on
	     <html>, and the shell flips them through interop. Light theme is the
	     absence of data-theme.

	     This is the same three lines the back office serves from App.razor, and it
	     is duplicated rather than shared because the two hosts have no shared host
	     page between them: one is a Razor component, the other a static file the
	     WebView loads. The contract is one sentence long and it is stated
	     identically in both places.

	     On this host TerminalShell calls setTheme with whatever ISystemTheme reads
	     off Android (Part II-A · Order entry · Dark). There is no setAccent caller
	     here — the terminal has no accent picker — but the function is kept so the
	     two hosts expose the same object, and so a venue accent applied at app
	     start has somewhere to go. -->
	<script>
		window.uposShell = {
			setTheme: function (theme) {
				if (theme) {
					document.documentElement.setAttribute('data-theme', theme);
				} else {
					document.documentElement.removeAttribute('data-theme');
				}
			},
			setAccent: function (accent) {
				document.documentElement.setAttribute('data-accent', accent);
			}
		};
	</script>
</body>
</html>
